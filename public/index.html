<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>4 images → 3D (live)</title>
<style>
  body{margin:0;font-family:Arial;background:#071827;color:#e6eef8}
  .app{display:flex;height:100vh}
  .left{width:360px;padding:16px}
  .thumb{width:48%;display:inline-block;height:120px;background:#0b1220;margin:1%;border-radius:8px;overflow:hidden;position:relative}
  .thumb input{position:absolute;inset:0;opacity:0}
  button{padding:10px;border-radius:8px;border:none;background:#60a5fa;color:#042;cursor:pointer}
  .progress-bar{height:12px;background:#0b1220;border-radius:999px;overflow:hidden;margin-top:12px}
  .progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#6ee7b7,#60a5fa);transition:width .2s}
  .viewer{flex:1;position:relative}
  canvas{width:100%;height:100%;display:block}
  .status{position:absolute;left:16px;top:16px;background:rgba(0,0,0,0.35);padding:8px;border-radius:8px}
</style>
</head>
<body>
<div class="app">
  <div class="left">
    <h3>Image to 3D — 4 images</h3>
    <div id="thumbs">
      <label class="thumb"><input type="file" data-index="0"></label>
      <label class="thumb"><input type="file" data-index="1"></label>
      <label class="thumb"><input type="file" data-index="2"></label>
      <label class="thumb"><input type="file" data-index="3"></label>
    </div>
    <div style="margin-top:12px">
      <button id="generateBtn">Générer 3D</button>
      <button id="gradientBtn">Dégradé</button>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div id="progressText" style="margin-top:8px;color:#9fb6c0">Prêt</div>
  </div>

  <div class="viewer">
    <canvas id="viewerCanvas"></canvas>
    <div class="status" id="statusBox">Aucun job</div>
  </div>
</div>

<!-- libs -->
<script src="https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.154.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.154.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>
/* CONFIG : remplacez par l'URL publique de votre backend Render si nécessaire */
const SOCKET_URL = (typeof SOCKET_URL !== 'undefined' && SOCKET_URL) ? SOCKET_URL : location.origin;

const thumbs = Array.from(document.querySelectorAll('.thumb'));
const files = [null, null, null, null];
thumbs.forEach((el, i) => {
  const input = el.querySelector('input');
  input.addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    files[i] = f;
    const img = document.createElement('img');
    img.src = URL.createObjectURL(f);
    img.style.width = '100%'; img.style.height = '100%'; img.style.objectFit = 'cover';
    el.innerHTML = ''; el.appendChild(img);
    el.appendChild(input);
  });
});

const socket = io(SOCKET_URL, { transports: ['websocket','polling'] });
const statusBox = document.getElementById('statusBox');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
let currentJobId = null;

socket.on('connect', () => console.log('socket connected', socket.id));
socket.on('connect_error', err => console.error('socket connect_error', err));
socket.on('job.progress', payload => {
  console.log('job.progress', payload);
  if (currentJobId && payload.jobId !== currentJobId) return;
  // Mettre à jour la barre
  progressFill.style.width = payload.percent + '%';
  progressText.textContent = payload.percent + '% — ' + payload.message;
  statusBox.textContent = payload.message;
  // Charger partial si fourni
  if (payload.partialModelUrl) {
    const url = payload.partialModelUrl.startsWith('http') ? payload.partialModelUrl : SOCKET_URL + payload.partialModelUrl;
    loadModel(url, true); // true = partial (fade)
  }
});
socket.on('job.finished', payload => {
  console.log('job.finished', payload);
  if (currentJobId && payload.jobId !== currentJobId) return;
  progressFill.style.width = '100%';
  progressText.textContent = 'Terminé';
  statusBox.textContent = 'Terminé';
  if (payload.modelUrl) {
    const url = payload.modelUrl.startsWith('http') ? payload.modelUrl : SOCKET_URL + payload.modelUrl;
    loadModel(url, false);
  }
  currentJobId = null;
});

document.getElementById('generateBtn').addEventListener('click', startJob);

function startJob() {
  const present = files.filter(Boolean).length;
  if (present < 4) { alert('Veuillez sélectionner 4 images'); return; }
  const fd = new FormData();
  files.forEach((f, i) => fd.append('image' + i, f));
  fetch(SOCKET_URL + '/api/start-job', { method: 'POST', body: fd })
    .then(r => r.json())
    .then(data => {
      if (data.error) { alert(data.error); return; }
      currentJobId = data.jobId;
      statusBox.textContent = 'Job lancé: ' + currentJobId;
      progressFill.style.width = '0%';
      progressText.textContent = '0% — Démarrage';
    }).catch(err => { console.error(err); alert('Erreur démarrage job'); });
}

/* Three.js viewer */
const canvas = document.getElementById('viewerCanvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x071827);
const camera = new THREE.PerspectiveCamera(45, 2, 0.1, 1000);
camera.position.set(0, 1.2, 2.5);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0.8, 0);

const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8); scene.add(hemi);
const dir = new THREE.DirectionalLight(0xffffff, 0.8); dir.position.set(5, 10, 7); scene.add(dir);

let currentModel = null;
let partialFadeTimeout = null;

function clearModel() {
  if (!currentModel) return;
  scene.remove(currentModel);
  currentModel.traverse && currentModel.traverse(c => {
    if (c.geometry) c.geometry.dispose();
    if (c.material) {
      if (Array.isArray(c.material)) c.material.forEach(m => m.dispose && m.dispose());
      else c.material.dispose && c.material.dispose();
    }
  });
  currentModel = null;
}

function loadModel(url, isPartial = false) {
  // Si même URL déjà chargé, ignorer
  if (currentModel && currentModel.userData && currentModel.userData.url === url) return;
  const loader = new THREE.GLTFLoader();
  loader.load(url, gltf => {
    // fade: si partial, on remplace progressivement l'ancien par le nouveau
    const newModel = gltf.scene;
    newModel.userData = { url };
    newModel.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; c.material = c.material.clone(); c.material.transparent = true; c.material.opacity = 0.0; }});
    scene.add(newModel);

    // animation de fondu
    const duration = isPartial ? 600 : 400;
    const start = performance.now();
    function fadeStep(t) {
      const p = Math.min(1, (t - start) / duration);
      newModel.traverse(c => { if (c.isMesh) c.material.opacity = p; });
      if (p < 1) requestAnimationFrame(fadeStep);
      else {
        // une fois le nouveau complètement visible, supprimer l'ancien
        if (currentModel && currentModel !== newModel) {
          scene.remove(currentModel);
        }
        currentModel = newModel;
      }
    }
    requestAnimationFrame(fadeStep);
  }, xhr => {
    // progression de téléchargement du GLB (optionnel)
  }, err => {
    console.error('GLTF load error', err);
  });
}

/* render loop */
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w * devicePixelRatio || canvas.height !== h * devicePixelRatio) {
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
}
function animate(t) {
  resize();
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
